name: Crown Odds Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore odds history
        uses: actions/cache/restore@v4
        with:
          path: last_odds.json
          key: odds-history-${{ github.run_id }}
          restore-keys: |
            odds-history-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          ISPORTS_API_KEY: ${{ secrets.ISPORTS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor2.py
      - name: Save odds history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_odds.json
          key: odds-history-${{ github.run_id }}
  check_match:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: pip install requests
      - name: Query match
        env:
          ISPORTS_API_KEY: ${{ secrets.ISPORTS_API_KEY }}
        run: python check_match.py
